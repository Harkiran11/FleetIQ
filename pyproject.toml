[project]
name = "fleet-iq-mlops"
version = "1.0.0"
description = "Maintenance risk scoring and freight pricing with MLflow, Prefect, FastAPI and a dependency-free operations dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src", "api"]
branch = true
omit = ["src/__init__.py", "api/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  "archive",
  "data",
  "frontend",
  "mlruns",
  "models",
  "models_test",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "RUF001", # ambiguous unicode in comments is fine for a prose-heavy project
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"api/**/*.py" = ["B008"] # FastAPI's Depends/Query idiom
"src/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
