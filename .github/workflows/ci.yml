name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fleetiq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src api tests

      - name: Format check
        run: ruff format --check src api tests

      - name: Tests and coverage
        run: pytest tests -q --cov=src --cov=api --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fleetiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name fleetiq-ci -p 8000:8000 \
            -e FLEETIQ_SKIP_BOOTSTRAP=1 fleetiq:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs fleetiq-ci
          exit 1
